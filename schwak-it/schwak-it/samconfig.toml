version = 0.1

[default]
[default.global.parameters]
stack_name = "schwak-it-consultancy"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = true
resolve_s3 = true
s3_prefix = "schwak-it-consultancy"
region = "us-east-1"
parameter_overrides = "Environment=prod"
tags = "Project=SCHWAK-IT ManagedBy=SAM"

[dev]
[dev.deploy.parameters]
stack_name = "schwak-it-consultancy-dev"
parameter_overrides = "Environment=dev"
region = "us-east-1"
tags = "Project=SCHWAK-IT ManagedBy=SAM Environment=dev"

[prod]
[prod.deploy.parameters]
stack_name = "schwak-it-consultancy-prod"
parameter_overrides = "Environment=prod"
region = "us-east-1"
tags = "Project=SCHWAK-IT ManagedBy=SAM Environment=prod"
